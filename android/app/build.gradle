plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kaanirmak.stockmind'
    compileSdk 34

    defaultConfig {
        applicationId "com.kaanirmak.stockmind"
        minSdk 24
        targetSdk 34
        versionCode 20
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            def ksPass = System.getenv("KEYSTORE_PASSWORD")
            def ksAlias = System.getenv("KEY_ALIAS")
            def ksKeyPass = System.getenv("KEY_PASSWORD")
            if (ksPath && ksPass && ksAlias && ksKeyPass) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            manifestPlaceholders = [allowCleartextTraffic: "false"]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            manifestPlaceholders = [allowCleartextTraffic: "true"]
            applicationIdSuffix ""
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.work:work-runtime:2.9.0'
}
