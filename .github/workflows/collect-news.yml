name: Collect news
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Restore previous snapshot
        run: |
          git fetch origin refs/heads/news-data:refs/remotes/origin/news-data || true
          git show origin/news-data:news.json > /tmp/news.json || rm -f /tmp/news.json
      - name: Collect news outside the Worker network
        run: node scripts/news/collect.mjs /tmp/news.json
      - name: Publish snapshot without rebuilding the app
        run: |
          git worktree add --detach /tmp/news-publish
          cd /tmp/news-publish
          if git show-ref --verify --quiet refs/remotes/origin/news-data; then
            git checkout -B news-snapshot origin/news-data
          else
            git checkout --orphan news-snapshot
            git rm -rf .
          fi
          cp /tmp/news.json news.json
          git add news.json
          git -c user.name=github-actions\[bot\] -c user.email=41898282+github-actions\[bot\]@users.noreply.github.com commit -m "Update news snapshot"
          git push origin HEAD:refs/heads/news-data
