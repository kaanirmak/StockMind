name: Build Signed Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & Verify Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify version parity across Gradle, package.json and API metadata
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const gradle = fs.readFileSync("android/app/build.gradle", "utf8");
            const meta = fs.readFileSync("src/lib/app/releaseMetadata.ts", "utf8");
            const vc = Number(gradle.match(/versionCode\s+(\d+)/)?.[1]);
            const vn = gradle.match(/versionName\s+"([^"]+)"/)?.[1];
            const mvc = Number(meta.match(/versionCode:\s*(\d+)/)?.[1]);
            const mvn = meta.match(/version:\s*'\''([^'\'']+)'\''/)?.[1];
            if (!vc || vc !== mvc || vn !== pkg.version || vn !== mvn) {
              throw new Error(`Version mismatch: pkg=${pkg.version}, gradle=${vn}(${vc}), meta=${mvn}(${mvc})`);
            }
            console.log(`Verified Android release v${vn} (versionCode=${vc})`);
          '

      - name: Validate signing secrets and assemble release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing Android release signing secrets" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/stockmind-release.jks"
          chmod 600 "${RUNNER_TEMP}/stockmind-release.jks"
          export KEYSTORE_PATH="${RUNNER_TEMP}/stockmind-release.jks"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature and compute SHA-256
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK_PATH"
          sha256sum "$APK_PATH" > "${APK_PATH}.sha256"
          cat "${APK_PATH}.sha256"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449a92b4c00e2b438b3b9 # v4
        with:
          name: stockmind-signed-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
