name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: "Build and Deploy to Cloudflare"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "Install dependencies"
        run: npm ci || npm install

      - name: "Run Typecheck"
        run: npm run typecheck

      - name: "Run Tests"
        run: npm test

      - name: "Build Cloudflare Worker"
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL:-https://jxujcjalxrgmjcecwkil.supabase.co}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY:-sb_publishable_ViHxJOr9MYuwnFapjAEolg_BxEHIVXi}"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-sb_publishable_ViHxJOr9MYuwnFapjAEolg_BxEHIVXi}"
          export NEXT_PUBLIC_APP_URL="${NEXT_PUBLIC_APP_URL:-https://stockmind.kaanrmak7.workers.dev}"
          npm run build:cloudflare
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: ${{ secrets.NEXT_PUBLIC_ENABLE_GOOGLE_AUTH }}
          NEXT_PUBLIC_ENABLE_GITHUB_AUTH: ${{ secrets.NEXT_PUBLIC_ENABLE_GITHUB_AUTH }}

      - name: "Deploy to Cloudflare Workers"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN detected. Deploying worker..."
            npx wrangler deploy
          else
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set in GitHub repository settings. Worker deployment skipped."
          fi
