name: Scheduled Background Jobs (Crons)

on:
  schedule:
    # Runs Monday through Friday at 15:30 UTC (18:30 Istanbul time) after BIST market close
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to execute'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - sync-funds
          - daily-report
          - purge-bloated-sessions

jobs:
  run-crons:
    name: Execute Background Jobs on Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Execute TEFAS Funds Sync
        if: ${{ github.event.inputs.job == 'all' || github.event.inputs.job == 'sync-funds' || github.event_name == 'schedule' }}
        run: |
          echo "Triggering TEFAS Funds Sync on Cloudflare Worker..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET || 'stockmind_cron_secret_2026_secure' }}" \
            "${{ secrets.NEXT_PUBLIC_APP_URL || 'https://stockmind.kaanrmak7.workers.dev' }}/api/cron/sync-funds")
          
          status=$(echo "$response" | tail -n1 | cut -d: -f2)
          body=$(echo "$response" | sed -e '$d')
          echo "Response HTTP Status: $status"
          echo "Response Body: $body"
          if [ "$status" -ne 200 ]; then
            echo "::error::TEFAS funds sync failed with HTTP $status"
            exit 1
          fi

      - name: Execute Daily Stock & Fund Report
        if: ${{ github.event.inputs.job == 'all' || github.event.inputs.job == 'daily-report' || github.event_name == 'schedule' }}
        run: |
          echo "Triggering Daily Market Report on Cloudflare Worker..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET || 'stockmind_cron_secret_2026_secure' }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.NEXT_PUBLIC_APP_URL || 'https://stockmind.kaanrmak7.workers.dev' }}/api/cron/daily-report")
          
          status=$(echo "$response" | tail -n1 | cut -d: -f2)
          body=$(echo "$response" | sed -e '$d')
          echo "Response HTTP Status: $status"
          echo "Response Body: $body"
          # Allow 200 or 207 (some emails delivered / partial)
          if [ "$status" -ne 200 ] && [ "$status" -ne 207 ]; then
            echo "::warning::Daily report returned HTTP $status"
          fi

      - name: Purge Bloated Sessions (On Demand)
        if: ${{ github.event.inputs.job == 'purge-bloated-sessions' }}
        run: |
          echo "Triggering Session Purge on Cloudflare Worker..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET || 'stockmind_cron_secret_2026_secure' }}" \
            "${{ secrets.NEXT_PUBLIC_APP_URL || 'https://stockmind.kaanrmak7.workers.dev' }}/api/cron/purge-bloated-sessions")
          
          status=$(echo "$response" | tail -n1 | cut -d: -f2)
          body=$(echo "$response" | sed -e '$d')
          echo "Response HTTP Status: $status"
          echo "Response Body: $body"
