name: Scheduled Background Jobs (Crons)

on:
  schedule:
    # Runs Monday through Friday at 15:30 UTC (18:30 Istanbul time) after BIST market close
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to execute'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - sync-funds
          - daily-report
          - purge-bloated-sessions
      resume_date:
        description: 'Original Istanbul date for a TEFAS retry after midnight (YYYY-MM-DD)'
        type: string

jobs:
  run-crons:
    if: ${{ github.event.inputs.job != 'daily-report' }}
    name: "Execute Background Crons"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ inputs.job == 'purge-bloated-sessions' && github.run_id || 'stockmind-tefas-sync' }}
      cancel-in-progress: false
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: "Setup Node.js 22"
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: 'npm'

      - name: "Install dependencies"
        run: npm ci

      # Step 1: Run TEFAS funds sync directly via Node.js outside the Worker network.
      - name: "Execute TEFAS Funds Sync (Direct Node Script)"
        if: ${{ github.event.inputs.job == 'all' || github.event.inputs.job == 'sync-funds' || github.event_name == 'schedule' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESUME_DATE: ${{ inputs.resume_date }}
        run: |
          echo "Syncing TEFAS mutual funds directly into Supabase..."
          args=(--resume)
          if [ -n "$RESUME_DATE" ]; then
            args+=("--resume-date=$RESUME_DATE")
          fi
          node scripts/sync-tefas-funds.mjs "${args[@]}"

      # Step 2: Session Purge (Maintenance)
      - name: "Purge Bloated Sessions (On Demand or Maintenance)"
        if: ${{ github.event.inputs.job == 'all' || github.event.inputs.job == 'purge-bloated-sessions' }}
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://stockmind.kaanrmak7.workers.dev' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is required in repository secrets but not set!"
            exit 1
          fi
          TARGET_URL="${APP_URL:-https://stockmind.kaanrmak7.workers.dev}"
          echo "Triggering Session Purge on: $TARGET_URL ..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$TARGET_URL/api/cron/purge-bloated-sessions")
          
          status=$(echo "$response" | tail -n1 | cut -d: -f2)
          body=$(echo "$response" | sed -e '$d')
          echo "Response HTTP Status: $status"
          echo "Response Body: $body"

  daily-report:
    name: Execute Daily Stock & Fund Report
    if: ${{ github.event.inputs.job == 'all' || github.event.inputs.job == 'daily-report' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send daily bulletin
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://stockmind.kaanrmak7.workers.dev' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is required in repository secrets."
            exit 1
          fi
          response=$(curl --silent --show-error --max-time 240 -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "$APP_URL/api/cron/daily-report")
          status=$(printf '%s\n' "$response" | tail -n1)
          body=$(printf '%s\n' "$response" | sed '$d')
          echo "Daily report HTTP status: $status"
          if [ "$status" != 200 ] || ! jq -e '.success == true' >/dev/null <<< "$body"; then
            echo "::error::Daily report was not completed for all recipients."
            exit 1
          fi
          jq '{recipientsCount, successfulCount, idempotent}' <<< "$body"
