name: Scheduled Background Jobs (Crons)

on:
  schedule:
    # Runs Monday through Friday at 15:30 UTC (18:30 Istanbul time) after BIST market close
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to execute'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - sync-funds
          - daily-report
          - purge-bloated-sessions

jobs:
  run-crons:
    name: "Execute Background Crons"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: "Install dependencies"
        run: npm ci || npm install

      # Step 1: Run TEFAS funds sync directly via Node.js outside the Worker network.
      # This avoids Cloudflare 50-subrequest limits and handles all funds reliably.
      - name: "Execute TEFAS Funds Sync (Direct Node Script)"
        if: ${{ github.event.inputs.job == 'all' || github.event.inputs.job == 'sync-funds' || github.event_name == 'schedule' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "Syncing TEFAS mutual funds directly into Supabase..."
          node scripts/sync-tefas-funds.mjs

      # Step 2: Trigger Daily Stock & Fund Report
      - name: "Execute Daily Stock & Fund Report"
        if: ${{ github.event.inputs.job == 'all' || github.event.inputs.job == 'daily-report' || github.event_name == 'schedule' }}
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://stockmind.kaanrmak7.workers.dev' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'stockmind_cron_secret_2026_secure' }}
        run: |
          TARGET_URL="${APP_URL:-https://stockmind.kaanrmak7.workers.dev}"
          SECRET="${CRON_SECRET:-stockmind_cron_secret_2026_secure}"
          echo "Triggering Daily Market Report on: $TARGET_URL ..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer $SECRET" \
            -H "Content-Type: application/json" \
            "$TARGET_URL/api/cron/daily-report")
          
          status=$(echo "$response" | tail -n1 | cut -d: -f2)
          body=$(echo "$response" | sed -e '$d')
          echo "Response HTTP Status: $status"
          echo "Response Body: $body"
          if [ "$status" -ne 200 ] && [ "$status" -ne 207 ]; then
            echo "::warning::Daily report completed with status $status"
          fi

      # Step 3: Session Purge (Maintenance)
      - name: "Purge Bloated Sessions (On Demand or Maintenance)"
        if: ${{ github.event.inputs.job == 'all' || github.event.inputs.job == 'purge-bloated-sessions' }}
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://stockmind.kaanrmak7.workers.dev' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'stockmind_cron_secret_2026_secure' }}
        run: |
          TARGET_URL="${APP_URL:-https://stockmind.kaanrmak7.workers.dev}"
          SECRET="${CRON_SECRET:-stockmind_cron_secret_2026_secure}"
          echo "Triggering Session Purge on: $TARGET_URL ..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer $SECRET" \
            "$TARGET_URL/api/cron/purge-bloated-sessions")
          
          status=$(echo "$response" | tail -n1 | cut -d: -f2)
          body=$(echo "$response" | sed -e '$d')
          echo "Response HTTP Status: $status"
          echo "Response Body: $body"
