name: Scheduled Background Jobs (Crons)

on:
  schedule:
    # Runs Monday through Friday at 15:30 UTC (18:30 Istanbul time) after BIST market close
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to execute'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - sync-funds
          - daily-report
          - purge-bloated-sessions

jobs:
  run-crons:
    name: "Execute Background Jobs on Cloudflare"
    runs-on: ubuntu-latest
    steps:
      - name: "Execute TEFAS Funds Sync"
        if: ${{ github.event.inputs.job == 'all' || github.event.inputs.job == 'sync-funds' || github.event_name == 'schedule' }}
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TARGET_URL="${APP_URL:-https://stockmind.kaanrmak7.workers.dev}"
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET GitHub secret is missing"; exit 1; fi
          SECRET="$CRON_SECRET"
          echo "Triggering TEFAS Funds Sync on Cloudflare Worker: $TARGET_URL ..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET \
            -H "Authorization: Bearer $SECRET" \
            "$TARGET_URL/api/cron/sync-funds")
          
          status=$(echo "$response" | tail -n1 | cut -d: -f2)
          body=$(echo "$response" | sed -e '$d')
          echo "Response HTTP Status: $status"
          echo "Response Body: $body"
          if [ "$status" -ne 200 ]; then
            echo "::error::TEFAS funds sync failed with HTTP $status"
            exit 1
          fi

      - name: "Execute Daily Stock & Fund Report"
        if: ${{ github.event.inputs.job == 'all' || github.event.inputs.job == 'daily-report' || github.event_name == 'schedule' }}
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TARGET_URL="${APP_URL:-https://stockmind.kaanrmak7.workers.dev}"
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET GitHub secret is missing"; exit 1; fi
          SECRET="$CRON_SECRET"
          echo "Triggering Daily Market Report on Cloudflare Worker: $TARGET_URL ..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer $SECRET" \
            -H "Content-Type: application/json" \
            "$TARGET_URL/api/cron/daily-report")
          
          status=$(echo "$response" | tail -n1 | cut -d: -f2)
          body=$(echo "$response" | sed -e '$d')
          echo "Response HTTP Status: $status"
          echo "Response Body: $body"
          # Allow 200 or 207 (some emails delivered / partial)
          if [ "$status" -ne 200 ] && [ "$status" -ne 207 ]; then
            echo "::warning::Daily report returned HTTP $status"
          fi

      - name: "Purge Bloated Sessions (On Demand)"
        if: ${{ github.event.inputs.job == 'purge-bloated-sessions' }}
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TARGET_URL="${APP_URL:-https://stockmind.kaanrmak7.workers.dev}"
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET GitHub secret is missing"; exit 1; fi
          SECRET="$CRON_SECRET"
          echo "Triggering Session Purge on Cloudflare Worker: $TARGET_URL ..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer $SECRET" \
            "$TARGET_URL/api/cron/purge-bloated-sessions")
          
          status=$(echo "$response" | tail -n1 | cut -d: -f2)
          body=$(echo "$response" | sed -e '$d')
          echo "Response HTTP Status: $status"
          echo "Response Body: $body"
