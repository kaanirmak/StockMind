name: Security & SAST Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run automatically every Monday at 04:00 UTC to catch new CVEs and dependency advisories
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-test-suite:
    name: "Security Unit Tests & Boundary Invariants"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Core Security Test Suite
        run: npm run test:security

  dependency-audit:
    name: "Production Dependency Audit (Supply Chain)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Validate dependency lockfile
        run: npm ci --ignore-scripts

      - name: Audit Production Dependencies
        run: npm audit --omit=dev

  codeql-analysis:
    name: "CodeQL SAST Analysis (CWE & Code Vulnerabilities)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          category: "/language:javascript-typescript"
          wait-for-processing: true

  secret-detection:
    name: "Secret & Credential Leak Detection"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog@c85580b712841eda4c53bc28fc6ace6100e8c16c # v3.99.4
        with:
          path: ./
          version: 3.99.4
          # Let the action select SHA ranges for PR/push events and the full
          # history for scheduled/manual runs. A local "main" ref need not exist.
          extra_args: --results=verified,unknown --fail-on-scan-errors

  security-gate:
    name: Security Gate
    if: always()
    needs: [security-test-suite, dependency-audit, codeql-analysis, secret-detection]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every security job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e 'length == 4 and all(.[]; .result == "success")' <<< "$RESULTS"
